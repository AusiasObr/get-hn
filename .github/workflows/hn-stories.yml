name: Daily HN Summary

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scraper
        run: python main.py

      - name: Upload Stories Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hn-daily-stories
          path: hn_stories/
          retention-days: 7